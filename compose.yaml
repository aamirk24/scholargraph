name: webservices

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped

    environment:
      POSTGRES_USER: sguser
      POSTGRES_PASSWORD: password
      POSTGRES_DB: scholargraph

    volumes:
      - scholargraph-postgres:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U sguser -d scholargraph
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  scholargraph-postgres: