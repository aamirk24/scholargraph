name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sguser
          POSTGRES_PASSWORD: password
          POSTGRES_DB: scholargraph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sguser -d scholargraph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://sguser:password@localhost:5432/scholargraph_test
      TEST_DATABASE_URL: postgresql+asyncpg://sguser:password@localhost:5432/scholargraph_test
      SECRET_KEY: github-actions-test-secret-key-not-for-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ENVIRONMENT: test
      UV_CACHE_DIR: /tmp/uv-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Verify CPU-only PyTorch
        run: |
          uv run python - <<'PY'
          import torch

          assert not torch.cuda.is_available()
          print("Torch version:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          PY

      - name: Run lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest